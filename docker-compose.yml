# Chạy thử Payment Hub trên máy local cùng cổng MoMo giả. KHÔNG dùng cho production.
#   docker compose up --build -d
#   node infra/local/demo.js
#   docker compose down -v
name: payment-hub-local

services:
  hub:
    build:
      context: .
      target: hub
    image: bsn-payment-hub:local
    restart: unless-stopped
    environment:
      HUB_CONFIG: /config/config.json
      # PostgreSQL của compose này, giá trị giả chỉ cho local.
      HUB_DATABASE_URL: postgres://hub:local-db-password-not-for-production@postgres:5432/hub
      # Giá trị giả chỉ cho chạy local; production lấy từ môi trường của máy chủ.
      HUB_API_TOKEN: local-dev-token-not-for-production
      MOMO_SECRET_KEY: local-secret-key-not-real
    volumes:
      - ./infra/local/hub.config.json:/config/config.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      momo-sim:
        condition: service_started
      redpanda-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: local-db-password-not-for-production
      POSTGRES_DB: hub
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:55433:5432"
    security_opt:
      - no-new-privileges:true

  momo-sim:
    build:
      context: .
      target: sim
    image: bsn-momo-sim:local
    environment:
      SIM_PORT: "8081"
      SIM_HOST: 0.0.0.0
      SIM_PARTNER_CODE: MOMOLOCAL01
      SIM_ACCESS_KEY: local-access-key-not-real
      SIM_SECRET_KEY: local-secret-key-not-real
    ports:
      - "127.0.0.1:8081:8081"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Broker Kafka-tương-thích cho lớp kết nối dịch vụ (PHUB-D-017): sự kiện ra và lệnh vào. Local, một nút, KHÔNG dùng cho production.
  # Trong mạng compose: redpanda:9092. Từ máy host: 127.0.0.1:19092 (test/e2e/kafka-live.test.js, infra/local/demo.js).
  redpanda:
    image: redpandadata/redpanda:v25.1.7
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
    ports:
      - "127.0.0.1:19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy -X brokers=redpanda:9092 || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30
    security_opt:
      - no-new-privileges:true

  # Tạo sẵn topic (production không tự tạo topic): sự kiện ra, lệnh vào, DLQ của lệnh.
  redpanda-init:
    image: redpandadata/redpanda:v25.1.7
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - rpk topic create payment.events.v1 payment.commands.v1 payment.commands.v1.dlq -p 3 -X brokers=redpanda:9092 || true
    depends_on:
      redpanda:
        condition: service_healthy

volumes:
  pg-data:
