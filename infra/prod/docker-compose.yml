# Payment Hub production: PostgreSQL + Hub + Caddy (TLS). Chạy bằng scripts/deploy.ps1, không `up` tay.
# Biến lấy từ .env cạnh file này (xem .env.example). Chỉ Caddy mở cổng ra ngoài.
name: bsn-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: hub
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    # Không có `ports`: DB chỉ truy cập được trong mạng compose.

  hub:
    image: ${HUB_IMAGE:?đặt HUB_IMAGE (repo:tag bất biến) trong .env hoặc môi trường}
    restart: unless-stopped
    env_file: .env
    environment:
      HUB_CONFIG: /config/config.json
      HUB_DATABASE_URL: postgres://hub:${POSTGRES_PASSWORD}@postgres:5432/hub
      HUB_PUBLIC_BASE_URL: https://${HUB_DOMAIN:?đặt HUB_DOMAIN}
    volumes:
      - ./hub.config.json:/config/config.json:ro
    user: "node"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN}
      HUB_ADMIN_ALLOW_CIDR: ${HUB_ADMIN_ALLOW_CIDR:-0.0.0.0/0 ::/0}
    ports:
      - "${HUB_HTTP_PORT:-80}:80"
      - "${HUB_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    depends_on:
      hub:
        condition: service_healthy

volumes:
  pg-data:
  caddy-data:
  caddy-config:
