schema: 1
service: "payment-hub"
title: "Payment Hub"
summary: "Dịch vụ đứng giữa cửa hàng và các cổng thanh toán (VNPay, MoMo, OnePAY, SePay trong nước; Stripe và PayPal quốc tế). Cửa hàng chỉ nói chuyện với Hub; Hub chọn cổng, theo dõi từng lần thanh toán và giữ cho tiền với đơn hàng luôn khớp nhau."
updated: "2026-10-07"
business:
  goal: "Cửa hàng và các dịch vụ BSN thu tiền qua nhiều cổng thanh toán mà không phải biết cổng nào đứng sau. Hub giữ cho tiền và đơn hàng luôn khớp nhau, kể cả khi cổng báo trễ, báo trùng hoặc không báo."
  users:
    - who: "Cửa hàng và dịch vụ BSN khác"
      need: "Tạo thanh toán và nhận kết quả qua HTTP API, Kafka hoặc webhook mà không phụ thuộc cổng cụ thể."
    - who: "Khách trả tiền"
      need: "Được chuyển tới cổng (hoặc nhận hướng dẫn chuyển khoản) và tiền đã trả được ghi nhận đúng vào đơn."
    - who: "Người vận hành"
      need: "Thấy giao dịch bất thường (tiền về muộn, trùng, lệch, tranh chấp, giữ tiền quá lâu) và cấu hình cổng, phương án thanh toán, loại tiền, bảng mã lỗi mà không sửa lõi."
  value:
    - "Đổi hoặc thêm cổng thanh toán là thêm một adapter, không sửa lõi và không sửa dịch vụ gọi."
    - "Tiền với đơn hàng được đối soát nền, không dựa vào việc cổng luôn báo đúng lúc."
    - "Một hợp đồng chuẩn cho mọi cổng: loại sự kiện, mã lý do thất bại, phương án thanh toán, loại tiền ISO 4217, khả năng của cổng, bước tiếp theo cho khách (chuyển hướng, 3DS, QR, chuyển khoản), giữ tiền rồi thu sau (authorize, capture, void)."
  flows:
    - id: "thanh-toan"
      title: "Một lần thanh toán"
      steps:
        - "Cửa hàng gọi Hub tạo thanh toán cho đơn. Gọi lại cùng cửa hàng và orderId khi đơn cũ chưa đóng thì cùng số tiền và loại tiền trả lại đơn cũ, khác thì báo order_conflict; không bao giờ tạo thêm lần thu."
        - "Hub lọc cổng theo cổng đang bật, đúng sản phẩm, trong khoảng số tiền, nhận loại tiền của đơn và đúng phương án thanh toán, rồi tạo một lần thử (attempt) ở cổng đứng đầu."
        - "Khách trả tiền trên trang cổng hoặc chuyển khoản theo hướng dẫn (buớc tiếp theo cho khách do Hub trả về ở dạng chuẩn)."
        - "Cổng báo kết quả về Hub (callback/IPN); nếu cổng không báo, Hub tự hỏi lại. Với PayPal, khách duyệt xong tiền chưa chuyển: adapter thu giúp Hub khi khách quay về hoặc khi webhook duyệt đến."
        - "Hub chuẩn hóa kết quả về hợp đồng chuẩn, cập nhật trạng thái và phát sự kiện ra cho cửa hàng (webhook hoặc Kafka)."
    - id: "thong-bao-cua-cong"
      title: "Thông báo của cổng: sai chữ ký, trùng, sai thứ tự, lệch tiền"
      steps:
        - "Cổng gọi GET hoặc POST /ipn/{gateway} (báo từ máy cổng) hoặc /return/{gateway} (trình duyệt khách quay về, chỉ để hiển thị, không đổi trạng thái)."
        - "Adapter kiểm chữ ký. Sai chữ ký thì Hub ghi invalid_signature và không đổi gì. Chữ ký đúng nhưng lỗi tra cứu tạm thời thì Hub không đổi gì và trả lỗi để cổng gửi lại (retry_later)."
        - "Thông báo không gắn được attempt nào: tiền vào mà không biết chủ thì ghi cảnh báo unmatched_funds; mã tham chiếu lạ thì ghi unknown_attempt. Cả hai đều chờ người vận hành."
        - "Sự kiện trùng (cùng cuộc trả lời) được phát hiện và bỏ qua (duplicate). Nếu cùng một kênh báo thành công lần hai với mã giao dịch khác thì đó là khoản thu thêm: cảnh báo duplicate_charge."
        - "Số tiền hoặc loại tiền trong thông báo thành công khác attempt: Hub không ghi nhận đã trả, ghi cảnh báo amount_mismatch (gửi lại vẫn báo lệch, không coi là trùng)."
        - "Attempt đã đóng (thất bại, hủy, hết hạn) mà cổng báo thành công: trạng thái cuối không đổi, Hub ghi late_success (hoặc duplicate_charge nếu đơn đã PAID bởi attempt khác) để người vận hành xử lý."
        - "Thứ tự không được bảo đảm: trạng thái đang xử lý (pending) đến sau thành công không làm attempt lùi lại; authorized cùng giao dịch đến sau khi đã thu hoặc đã nhả thì coi là trùng, không phải cảnh báo; khác giao dịch hoặc sau FAILED thì ghi late_authorization."
    - id: "chua-ro"
      title: "Khi lời gọi tới cổng mất phản hồi (trạng thái chưa rõ)"
      steps:
        - "Hub gọi cổng tạo thanh toán (hoặc thu, nhả, hoàn) nhưng cổng không trả lời kịp hoặc trả lỗi 5xx."
        - "Attempt để ở UNKNOWN (chưa biết cổng đã thu hay chưa). UNKNOWN vẫn được coi là có thể nhận tiền: không chuyển sang cổng khác, không đánh dấu thất bại."
        - "Kết quả đến từ thông báo của cổng hoặc từ đối soát nền hỏi lại cổng. Trước mốc hết hạn cứng của cổng, chỉ hỏi lại; qua mốc đó cộng thời gian chờ thì hỏi lần cuối rồi mới đóng."
        - "Riêng thu và nhả khoản giữ: sau khi mất phản hồi, thao tác thứ hai bị chặn (op_in_progress) cho tới khi biết kết quả thao tác trước. Hoàn tiền mất phản hồi ở trạng thái REQUESTED và được đối soát sau, trừ khi biết chắc chưa gửi đi thì FAILED."
    - id: "chuyen-cong"
      title: "Thử lại hoặc chuyển sang cổng khác"
      steps:
        - "Trong lúc tạo: cổng từ chối rõ ràng hoặc Hub chưa gửi được lời gọi thì Hub tự thử cổng kế tiếp trong cùng lời gọi."
        - "Sau khi đã tạo: phải do cửa hàng yêu cầu tạo attempt mới (POST /payments/{id}/attempts). Đơn phải còn OPEN, chuyển cổng không bị tắt, chưa đủ số lần thử."
        - "Nếu còn attempt có thể nhận tiền (CREATED, AWAITING, UNKNOWN, AUTHORIZED) thì Hub chỉ tạo attempt mới khi cửa hàng yêu cầu hủy và cổng hủy được; không thì báo attempt_still_live để tránh thu hai lần. Attempt đang giữ tiền không bao giờ bị Hub tự hủy."
    - id: "hoan-tien"
      title: "Hoàn tiền"
      steps:
        - "Chỉ hoàn được attempt đã nhận tiền (SUCCEEDED), trừ phần cổng đã đảo lại. Tổng các lần hoàn (không tính lần FAILED) không vượt số đã thu; vượt thì báo invalid_refund_amount. Có trần số lần hoàn và tuổi giao dịch gốc (refund_limit)."
        - "Khoản nằm trong cảnh báo late_success hoặc duplicate_charge chỉ dựa vào một thông báo chưa kiểm: Hub phải hỏi cổng và cổng xác nhận tiền đã về thì mới hoàn (không thì báo not_confirmed). Chỉ quản trị mới được ép (force)."
        - "Cổng không hoàn được bằng API thì hoàn ở trạng thái MANUAL_REQUIRED, người vận hành làm tay rồi xác nhận (POST /refunds/{id}/done)."
        - "Tiền bị cổng đảo lại từ ngoài Hub (reversed) hay tranh chấp (dispute): Hub không đổi trạng thái đơn vì hàng có thể đã giao, chỉ ghi cảnh báo funds_reversed hay dispute_* và giảm phần còn hoàn được."
    - id: "doi-soat"
      title: "Khi cổng báo trễ, trùng hoặc không báo"
      steps:
        - "Đối soát nền hỏi lại cổng cho các attempt còn chờ."
        - "Attempt đã đóng vẫn được hỏi lại ở mốc 1 giờ và 24 giờ để bắt tiền về muộn."
        - "Trường hợp không tự xử lý được thì báo người vận hành, không tự coi là thất bại."
    - id: "giu-tien"
      title: "Giữ tiền rồi thu sau (cổng có hỗ trợ)"
      steps:
        - "Cổng báo đã giữ tiền (authorized): attempt chuyển sang AUTHORIZED, đơn vẫn mở, chưa phải tiền đã thu."
        - "Cửa hàng giao hàng rồi gọi capture để thu đủ số đã giữ, hoặc gọi void để nhả."
        - "Nếu cổng mất phản hồi khi thu hoặc nhả, Hub không coi là thất bại: ghi là chưa rõ, chặn thao tác kế tiếp và hỏi lại cổng."
        - "Giữ quá lâu mà không ai thu hay nhả thì Hub báo người vận hành (authorization_stale); Hub không tự thu hay tự nhả."
  out_of_scope:
    - "Sổ cái, chống gian lận: chưa có."
    - "Tranh chấp (dispute): mới chỉ ghi nhận và báo người vận hành (không đổi trạng thái đơn, chưa gửi ra cửa hàng, chưa theo dõi hạn nộp bằng chứng)."
    - "Giữ tiền rồi thu sau: chưa thu một phần (chỉ thu đủ số đã giữ), chưa gửi sự kiện khoản giữ ra cửa hàng (cửa hàng đọc payment), chưa có cấu hình tự hủy khoản giữ theo thời gian."
    - "Quản lý cửa hàng bằng API: hiện chỉ qua tệp cấu hình."
    - "Chạy nhiều tiến trình Hub cùng ghi một schema: hiện một tiến trình ghi mỗi schema."
    - "Routing theo số liệu đo được (tỉ lệ thành công, độ trễ) và tự chuyển cổng: chưa làm, cần dữ liệu thật trước."
    - "Routing theo nước của cửa hàng: regions mới chỉ là khai báo của adapter."
  unverified:
    - "Chưa nối cổng thật nào: mọi test chạy với simulator và adapter giả."
    - "Bảng mã lỗi của các cổng: chỉ theo tài liệu (VNPay, MoMo) hoặc gần như trống (OnePAY, SePay)."
    - "Khai báo phương án thanh toán (methods), loại tiền (currencies) và nước (regions) của các adapter: theo tài liệu, chưa kiểm với cổng thật."
    - "Hành vi trả tiền muộn trên URL cũ của attempt đã thất bại; mốc hỏi lại 1 giờ và 24 giờ là lựa chọn ban đầu, chưa dựa trên dữ liệu thật."
    - "Cổng thật có gửi thông báo trùng hay sai thứ tự thế nào và bao nhiêu lần: Hub xử lý theo giả định xấu nhất, nhưng các ca này chỉ kiểm bằng simulator."
    - "SePay B/C: mọi hành vi là giả định từ tài liệu và simulator, nhất là mã giao dịch của IPN VOID và thông báo REFUND."
    - "Tài liệu OnePAY chính thức không truy cập được, chỉ có bản sao năm 2020."
    - "Kafka mới thử với Redpanda một nút (có cả ca broker bị đóng băng giữa chừng và Hub khởi động lại, PHUB-D-032) và broker giả; hạn thời gian Kafka (request 10 giây, kết nối 3 giây, thử lại 2 lần) là lựa chọn ban đầu, chưa đo trên broker production; chưa thử SASL/TLS hay nhiều broker."
    - "Nhánh -Push và -Remote của scripts/deploy.ps1 chưa chạy thật (chưa có VM, Docker Hub private, tên miền)."
    - "Stripe (cổng quốc tế đầu tiên), loại tiền ngoài VND, NextAction, tranh chấp, giữ tiền rồi thu sau, extra: mới kiểm bằng simulator và adapter giả, CHƯA kiểm với Stripe thật (chưa có khóa test). Thiết kế dựa trên đọc tài liệu và mã nguồn mở, chưa chạy với Stripe."
    - "Stripe hosted Checkout: thẻ hỏng có sinh sự kiện thất bại không (simulator giả định là không), payment_status của phiên khi mới giữ tiền, metadata chép sang Charge và Dispute, UGX, quy tắc bội 10 của tiền ba chữ số, mã lỗi thật khi thu hai lần, hạn hoàn tối đa."
    - "Chưa biết cổng thật báo tranh chấp qua IPN hay chỉ qua sao kê, xử lý thu trễ, void sau khi đã thu hay hết hạn giữ ra sao."
    - "PayPal (cổng quốc tế thứ hai): mọi hành vi mới ở mức tài liệu (đọc qua công cụ tóm tắt) hoặc suy ra, chưa gọi PayPal lần nào: tên trường và mã lỗi; custom_id có chép sang capture, hoàn và webhook; khách duyệt rồi đóng tab có sinh CHECKOUT.ORDER.APPROVED đáng tin không."
    - "PayPal: chữ ký webhook với chứng chỉ thật (chưa kiểm chuỗi tin cậy), capture PENDING kéo dài bao lâu, hình dạng tranh chấp, hạn order 3 giờ và khoản giữ 29 ngày, TWD (tài liệu tóm tắt tự mâu thuẫn)."
    - "PayPal không hỗ trợ VND (theo tài liệu): đơn VND không bao giờ đi PayPal. Khách duyệt mà cả return lẫn webhook mất thì không ai thu (không bị trừ tiền, phải thử lại); duyệt muộn hơn hạn đơn Hub vẫn bị thu và thành late_success (P-014)."
architecture:
  summary: "Ba lớp, phụ thuộc một chiều: vào/ra, chuẩn hóa, logic nội bộ, gặp nhau qua hợp đồng chuẩn. Có hai trục tách nhau: phía kết nối dịch vụ (cửa hàng, dịch vụ BSN) và phía cổng thanh toán. Lõi không biết gì riêng về cổng nào; chỉ main.js và index.js nối hai trục. Ranh giới được test quét import và quét tên cổng giữ (tên cổng lấy từ chính các thư mục src/adapters, nên cổng mới tự được kiểm). Adapter từng cổng nạp lúc chạy qua registry (require động theo tên thư mục) và được tiêm vào lõi khi dựng, nên lệnh nhập tĩnh không thấy mũi tên lõi tới adapter."
  layers:
    - id: "io"
      title: "Vào/ra"
      role: "Nói chuyện với bên ngoài: HTTP, Kafka, webhook, nhận callback của cổng. Lời gọi API cổng và ký chữ ký nằm trong từng adapter (cùng tệp với phần chuẩn hóa, xem P-008)."
      paths:
        - "src/connectors/in"
        - "src/connectors/out"
        - "src/server.js"
    - id: "normalize"
      title: "Chuẩn hóa"
      role: "Dịch giữa dạng của bên ngoài và dạng chuẩn: danh mục thao tác, schema, mã lỗi, loại sự kiện, phương án thanh toán, loại tiền. Mỗi cổng một thư mục adapter dịch dạng của cổng sang dạng chuẩn (và gọi cổng qua deps.fetch)."
      paths:
        - "src/app"
        - "src/adapters"
        - "src/contract.js"
    - id: "core"
      title: "Logic nội bộ"
      role: "Nghiệp vụ, máy trạng thái, kho lưu; chỉ biết dạng chuẩn."
      paths:
        - "src/hub.js"
        - "src/routing.js"
        - "src/events.js"
        - "src/store.js"
        - "src/store-postgres.js"
        - "src/guard.js"
        - "src/metrics.js"
  components:
    - id: "connectors-in"
      title: "Connector vào"
      layer: "io"
      role: "Nhận yêu cầu từ dịch vụ khác qua HTTP và Kafka."
      paths:
        - "src/connectors/in"
    - id: "connectors-out"
      title: "Connector ra"
      layer: "io"
      role: "Phát sự kiện ra qua webhook và Kafka (hộp thư đi nhiều tuyến)."
      paths:
        - "src/connectors/out"
    - id: "app"
      title: "Cổng vào chuẩn (app)"
      layer: "normalize"
      role: "Danh mục thao tác, schema, mã lỗi, view; port có kiểu JSDoc và kiểm hình dạng lúc chạy."
      paths:
        - "src/app"
    - id: "hub"
      title: "Lõi Hub"
      layer: "core"
      role: "Máy trạng thái thanh toán và attempt (kể cả giữ tiền rồi thu), đối soát nền, hỏi lại attempt đã đóng."
      paths:
        - "src/hub.js"
    - id: "routing"
      title: "Routing"
      layer: "core"
      role: "Chọn cổng theo phương án thanh toán chuẩn và loại tiền; chỉ biết hợp đồng."
      paths:
        - "src/routing.js"
    - id: "store"
      title: "Kho lưu"
      layer: "core"
      role: "Lưu giao dịch và hộp thư đi trên PostgreSQL."
      paths:
        - "src/store.js"
        - "src/store-postgres.js"
    - id: "contract"
      title: "Hợp đồng chuẩn"
      layer: "normalize"
      role: "Loại sự kiện, FAIL_CODES, METHODS, loại tiền ISO 4217, NextAction, khả năng adapter; lõi và adapter chỉ gặp nhau ở đây."
      paths:
        - "src/contract.js"
    - id: "adapters"
      title: "Adapter từng cổng"
      layer: "normalize"
      role: "Mỗi cổng một thư mục tự đăng ký (registry): VNPay, MoMo, OnePAY, SePay, Stripe, PayPal. Thêm cổng là thêm thư mục."
      paths:
        - "src/adapters"
    - id: "simulators"
      title: "Simulator cổng"
      role: "Cổng giả để test (cả Stripe và PayPal); là sự thật nền của test, không phải của cổng thật."
      paths:
        - "tools/sim"
  depends_on:
    - target: "PostgreSQL"
      kind: "infra"
      via: "pg"
      purpose: "Cơ sở dữ liệu duy nhất: giao dịch, attempt, hộp thư đi."
    - target: "VNPay"
      kind: "external"
      via: "HTTP + IPN"
      purpose: "Cổng thanh toán chuyển hướng. Chưa nối cổng thật."
    - target: "MoMo"
      kind: "external"
      via: "HTTP + IPN"
      purpose: "Cổng thanh toán chuyển hướng. Chưa nối cổng thật."
    - target: "OnePAY"
      kind: "external"
      via: "HTTP + IPN"
      purpose: "Cổng thanh toán chuyển hướng. Chưa nối cổng thật."
    - target: "SePay"
      kind: "external"
      via: "HTTP + webhook"
      purpose: "Chuyển khoản và sao kê (sản phẩm A/B/C). Chưa nối cổng thật."
    - target: "Stripe"
      kind: "external"
      via: "HTTP + webhook có chữ ký"
      purpose: "Cổng quốc tế (Checkout hosted, giữ tiền rồi thu, tranh chấp). Chỉ kiểm với simulator, chưa nối Stripe thật."
    - target: "PayPal"
      kind: "external"
      via: "HTTP (Orders v2, Payments v2) + webhook chữ ký RSA + return_url"
      purpose: "Cổng quốc tế thứ hai: khách duyệt trên PayPal rồi adapter thu hay giữ giúp Hub; hoàn, tranh chấp. Không nhận VND. Chỉ kiểm với simulator, chưa nối PayPal thật (P-013)."
    - target: "Kafka"
      kind: "infra"
      via: "connector Kafka"
      purpose: "Nhận lệnh và phát sự kiện. Production chưa bật, chưa chọn broker."
  provides:
    - to: "Cửa hàng và dịch vụ BSN"
      via: "HTTP API (OpenAPI 3.1), Kafka"
      purpose: "Tạo thanh toán, truy vấn trạng thái, thu hoặc nhả khoản giữ, hoàn tiền."
    - to: "Cửa hàng và dịch vụ BSN"
