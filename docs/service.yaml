  - id: "P-011"
    title: "Ca test còn thiếu hoặc chưa chạy mặc định"
    severity: "medium"
    status: "open"
    found: "2026-10-06"
    updated: "2026-10-07"
    detail: "So bộ test hiện có (687 ca; tìm theo tên test và từ khóa, chưa đọc từng assert) với các nhóm cần có. Chưa thấy ca cho: (1) thông báo của cổng đến khi attempt còn CREATED, tức trước khi lời gọi tạo trả về; (2) tắt tiến trình đúng giữa lúc ghi bảng và lúc phát sự kiện: hiện chỉ có SIGKILL ngẫu nhiên giữa tải (test/e2e/hub-crash.test.js) và kiểm không giao lần hai sau khởi động (scenarios-delivery-pg), không chèn điểm dừng chính xác; (3) Stripe trong kịch bản ngẫu nhiên và mô phỏng (scenarios-sim): chưa có; (4) ma trận mỗi luồng nhân mỗi cổng qua HTTP cùng simulator: chưa đủ (e2e theo cổng có hub-sims cho ba cổng chuyển hướng, hub-sepay-*, hub-transfer, hub-stripe; thu, nhả, tranh chấp chỉ ở Stripe; hoàn một phần chưa kiểm cho từng cổng). Đã có: tạo trùng cùng và khác nội dung, số tiền ở biên (hub-edge-inputs), chữ ký sai ở từng adapter, webhook trùng, sai thứ tự, lệch số tiền, cổng lỗi hoặc quá giờ (hub-faulty-gateway), mã ngoài bảng ánh xạ (fail-codes), hai yêu cầu cùng lúc (scenarios-concurrency), hoàn quá số đã thu. Thêm: 44 ca cần PostgreSQL hoặc Kafka thật bị bỏ qua khi không đặt HUB_TEST_DATABASE_URL và broker, nên chạy mặc định không kiểm tích hợp thật."
    refine: "Cập nhật 2026-10-07: bốn nhóm đã có test. (1) callback đến khi CREATED: test/hub/callback-before-create.test.js, 3 ca, LỘ LỖI LÕI THẬT (xem P-012), đang để todo. (2) chết giữa ghi và phát: test/hub/crash-write-emit.test.js, 3 ca (chết trước COMMIT, sau COMMIT trước khi giao, sau khi sink nhận trước khi ghi kết quả giao), qua; điểm dừng chèn ở ranh giới COMMIT, chưa kiểm chết tiến trình thật giữa hai câu SQL. (3) Stripe trong kịch bản ngẫu nhiên: test/e2e/scenarios-stripe.test.js và test/support/stripe-runner.js, charge và auth, chạy 150 seed x 100 bước mỗi loại, 0 lỗi. (4) hoàn một phần theo từng cổng: test/e2e/hub-refund-matrix.test.js, 10 ca cho VNPay, MoMo, OnePAY, SePay A, Stripe, qua. Còn thiếu của nhóm 4: thu, nhả, tranh chấp cho cổng không phải Stripe (các cổng khác không có khả năng đó). Đo với PostgreSQL thật: 705 ca, 700 qua, 0 hỏng, 2 bỏ qua (Kafka thật), 3 todo (P-012). Mọi ca chỉ chạy với simulator và adapter giả."
    refs:
      - "test/support/pg.js:11"
      - "test/e2e/hub-crash.test.js"
      - "test/hub/scenarios-concurrency.test.js"
      - "test/e2e/scenarios-sim.test.js"
  - id: "P-012"
    title: "Kết quả lời gọi tạo đến muộn ghi đè trạng thái attempt đã nhận thông báo của cổng"
    severity: "high"
    status: "resolved"
    found: "2026-10-07"
    updated: "2026-10-07"
    detail: "Nếu thông báo của cổng (IPN/webhook) đến khi attempt còn CREATED, tức trước khi lời gọi createPayment của adapter trả về, Hub ghi nhận đúng (SUCCEEDED và payment PAID, hoặc FAILED). Nhưng khi lời gọi tạo trả về sau, _startAttempt (src/hub.js, khoảng dòng 490-520) gán thẳng attempt.status = 'AWAITING' (redirect, instructions, next_action) hoặc 'UNKNOWN' (unknown), không kiểm trạng thái hiện tại. Kết quả: attempt đã thu tiền quay lại AWAITING/UNKNOWN trong khi payment đã PAID; attempt đã FAILED sống lại; trạng thái cuối không còn bất biến, khách có thể được đưa URL trả tiền lần nữa. Tái hiện bằng test/hub/callback-before-create.test.js (3 ca, đang đánh dấu todo). Xảy ra khi cổng nhanh hơn phản hồi tạo (có thật với IPN/webhook ngay sau khi khách trả, hiếm vì khách phải mở trang trả trước)."
    refine: "Đã sửa 2026-10-07 (người dùng duyệt): trong _startAttempt (src/hub.js), sau khi lời gọi tạo trả về, nếu attempt đã rời CREATED thì giữ nguyên trạng thái, chỉ lưu state của cổng và ghi sự kiện create_result_after_callback; không ghi đè bằng AWAITING, UNKNOWN hay finalize FAILED. Ba ca test/hub/callback-before-create.test.js nay qua (bỏ todo). Cả bộ với PostgreSQL thật: 705 ca, 703 qua, 0 hỏng, 2 bỏ qua (Kafka thật). Chưa kiểm với cổng thật: cổng nào thật sự gửi IPN trước khi phản hồi tạo đến nơi."
    refs:
      - "src/hub.js"
      - "test/hub/callback-before-create.test.js"
      - "P-011"
  - id: "P-013"
    title: "PayPal chưa kiểm với PayPal thật (chưa có sandbox)"
    severity: "high"
    status: "open"
    found: "2026-10-07"
    updated: "2026-10-07"
    detail: "Adapter PayPal (Orders v2) và simulator được viết từ trang tài liệu (đọc qua công cụ tóm tắt, chưa đối chiếu bản OpenAPI) và kinh nghiệm chung; chưa gọi PayPal lần nào. Chưa kiểm: tên trường và mã HTTP của lỗi; custom_id có chép từ order sang capture, khoản giữ, hoàn và webhook hay không (adapter dựa vào đó để biết attempt, có đường lùi là GET capture rồi GET order); refunds trả kèm custom_id khi xem order (queryRefund dựa vào); khách duyệt rồi đóng tab thì PayPal có gửi CHECKOUT.ORDER.APPROVED đáng tin không; chữ ký webhook với chứng chỉ thật (ta chỉ kiểm máy chủ phát, chưa kiểm chuỗi tin cậy, và không có dung sai thời gian); capture PENDING kéo dài ra sao; hình dạng resource và outcome_code của tranh chấp; hạn order 3 giờ và khoản giữ 29 ngày; TWD (tài liệu tóm tắt tự mâu thuẫn). Nếu cổng thật khác giả định, tiền khách trả có thể không được ghi nhận đúng."
    refine: "Chưa xử lý. Cần tài khoản sandbox PayPal (clientId, clientSecret, webhookId) rồi chạy từng giả định ở docs/agent/paypal-research.md mục \"Chưa kiểm với PayPal thật\". Cấu hình mẫu src/config.example.json để cổng tắt (enabled false)."
    refs:
      - "docs/agent/paypal-research.md"
      - "PYPL-S-001"
      - "PYPL-S-002"
      - "P-001"
  - id: "P-014"
    title: "PayPal: order sống 3 giờ nhưng đơn Hub chỉ 30 phút, khách duyệt muộn vẫn bị thu"
    severity: "medium"
    status: "open"
    found: "2026-10-07"
    updated: "2026-10-07"
    detail: "Order PayPal sống 3 giờ (hardExpiry 180 phút) còn đơn Hub mặc định 30 phút. Khách duyệt sau khi Hub đã hết hạn attempt thì adapter vẫn thu (return hoặc webhook CHECKOUT.ORDER.APPROVED) vì adapter không biết hạn của Hub. Hub ghi late_success (tiền thắng) và người vận hành phải xử lý, thường là hoàn tiền: khách bị trừ tiền cho một đơn cửa hàng có thể đã hủy. Có test (hub-paypal: \"khách duyệt SAU khi đơn Hub đã hết hạn\") chứng minh tiền không vô hình, nhưng không chứng minh nên thu."
    refine: "Chưa xử lý (quyết định có chủ ý ở PYPL-D-001, ghi là rủi ro). Cách sửa nếu cần: ghi hạn của Hub (createPayment.expiresAt) vào order (ví dụ reference_id, chưa kiểm PayPal có nhận) hoặc tra lại từ state, rồi adapter từ chối thu khi quá hạn và trả sự kiện expired; hoặc đặt hub.paymentTtlSeconds gần 3 giờ cho cổng này. Cần người dùng chọn."
    refs:
      - "PYPL-D-001"
      - "src/adapters/paypal/index.js"
      - "test/e2e/hub-paypal.test.js"
