id: "luong-5-doi-soat"
type: "flowchart"
title: "5. Đối soát chạy nền"
tab: "business"
sources:
  - "src/hub.js"
explain:
  meaning: "Thông báo của cổng có thể đến trùng, đến muộn hoặc không đến. Đối soát chạy nền là kênh chắc: Hub chủ động hỏi lại cổng về các lần thử còn có thể nhận tiền, để tiền đã thu không bị bỏ sót."
  read:
    - "Đọc từ trên xuống. Từ ô đầu có ba việc; mỗi vòng đối soát làm lần lượt từng việc, không chạy song song."
    - "Trong việc xét từng lần thử, hai câu hỏi \"Quá tuổi tối đa?\" và \"Qua hạn cứng?\" được xét độc lập."
    - "Các ô \"Cảnh báo\" là chỗ Hub gắn cờ cho người vận hành; Hub vẫn tiếp tục hỏi lại cổng."
  details:
    - term: "Với mỗi attempt còn nhận tiền"
      text: "Xét các lần thử chưa có kết quả cuối, tức là tiền vẫn có thể về."
    - term: "stale_attempt"
      text: "Lần thử tồn tại quá tuổi tối đa (tính từ lúc tạo, theo cấu hình) mà vẫn chưa có kết quả: gắn cờ một lần cho người vận hành."
    - term: "Hỏi lại cổng ngay"
      text: "Hỏi khi đã qua hạn cứng của cổng cộng thời gian đệm, hoặc khi tới lịch hỏi lại theo khoảng lùi dần. Hạn cứng chỉ có ở cổng khai một con số; VNPay và MoMo khai là chưa biết."
    - term: "Áp như một sự kiện nguồn query"
      text: "Câu trả lời của cổng đi qua đúng đường xử lý như thông báo, xem sơ đồ 3."
    - term: "Không đổi gì"
      text: "Cổng nói không thấy, đang xử lý, hoặc lỗi: Hub không suy ra thất bại từ việc không có câu trả lời."
    - term: "expiry_unresolved"
      text: "Đã qua hạn cứng mà vẫn không có kết quả cuối: cảnh báo cho người vận hành."
    - term: "kéo sao kê theo con trỏ"
      text: "Với cổng có sao kê (SePay), Hub kéo sao kê từ vị trí đã đọc tới; mọi khoản đi qua cùng đường xử lý."
    - term: "Phân xử cảnh báo bằng query"
      text: "Hỏi lại cổng cho các cảnh báo đang mở, đóng đơn hết hạn, và đối soát các yêu cầu hoàn tiền."
  pitfalls:
    - "\"Không thấy\" ở cổng không được hiểu là khách chưa trả."
    - "Sơ đồ không vẽ một việc nữa: Hub hỏi lại các lần thử đã đóng không thành công sau 1 giờ và 24 giờ để bắt tiền về muộn."
    - "Các mốc hỏi lại và việc cổng thật có cho khách trả muộn hay không là giả định, chưa kiểm với cổng thật."
  basis: "e64a9a2ec30bf756"
direction: "TB"
