id: "ket-noi-dich-vu"
type: "flowchart"
title: "Lớp kết nối dịch vụ: vào và ra"
tab: "architecture"
sources:
  - "src/connectors/registry.js"
  - "src/app/operations.js"
explain:
  meaning: "Sơ đồ cho thấy yêu cầu của cửa hàng và người vận hành đi vào Hub qua một cổng vào chuẩn, và mọi sự kiện Hub báo ra đều đi qua một hộp thư đi ghi cùng lúc với thay đổi trạng thái gây ra nó. Nhờ vậy thêm một cách kết nối mới (vào hoặc ra) không đụng tới lõi, và sự kiện đã ghi vẫn còn đó khi đích tạm chết."
  read:
    - "Đọc từ trái sang phải: connector vào, cổng vào chuẩn, lõi Hub, rồi connector ra."
    - "Nhánh đi xuống từ lõi Hub tới adapter là trục cổng thanh toán: nó độc lập với trục kết nối dịch vụ nằm ngang."
    - "Đường không mũi tên giữa PaymentHub và adapter là quan hệ giữa lõi và adapter: Hub gọi adapter để tạo, hỏi, hoàn và để đọc thông báo của cổng; adapter không gọi ngược Hub."
  details:
    - term: "HTTP"
      text: "Connector vào nhận yêu cầu HTTP của cửa hàng và người vận hành, rồi chuyển cho cổng vào chuẩn."
    - term: "Kafka: lệnh"
      text: "Connector vào đọc lệnh từ một topic Kafka và đưa vào cùng cổng vào chuẩn như HTTP."
    - term: "app.execute"
      text: "Cổng vào chuẩn cho mọi thao tác của cửa hàng và người vận hành: kiểm vai trò, kiểm dữ liệu theo schema, gọi thao tác, dựng dữ liệu trả về. Connector không chứa nghiệp vụ. Việc kiểm token nằm ở máy chủ HTTP."
    - term: "PaymentHub"
      text: "Lõi nghiệp vụ: máy trạng thái của đơn, lần thử thanh toán và hoàn tiền. Không biết yêu cầu tới bằng HTTP hay Kafka."
    - term: "Hộp thư đi"
      text: "Sự kiện được ghi cùng lúc với thay đổi trạng thái gây ra nó, rồi mới được giao tới từng đích. Mỗi đích được thử lại nhiều lần; quá số lần thì bản giao bị đánh dấu chết và giữ lại để gửi lại bằng tay."
    - term: "Adapter"
      text: "Mỗi cổng thanh toán một adapter cô lập; lõi chỉ nói chuyện với adapter qua hợp đồng chuẩn."
    - term: "Webhook"
      text: "Connector ra giao sự kiện tới địa chỉ webhook của cửa hàng."
    - term: "Kafka"
      text: "Connector ra phát sự kiện lên một topic Kafka."
  pitfalls:
    - "Không phải mọi thứ đều qua cổng vào chuẩn: thông báo của cổng thanh toán và bộ lập lịch đối soát gọi thẳng lõi Hub. Sơ đồ không vẽ hai đường này."
    - "Sơ đồ là cấu trúc, không phải thứ tự thời gian của một giao dịch; trình tự xem ở các sơ đồ trình tự trong tab Nghiệp vụ."
    - "Kafka mới được thử với broker một nút chạy cục bộ; broker production chưa chọn."
  basis: "6e03f3c49c7c9ee8"
