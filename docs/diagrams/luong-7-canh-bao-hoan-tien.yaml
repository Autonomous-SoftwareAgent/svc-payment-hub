id: "luong-7-canh-bao-hoan-tien"
type: "flowchart"
title: "7. Cảnh báo tiền và hoàn tiền"
tab: "business"
sources:
  - "src/hub.js"
explain:
  meaning: "Sơ đồ mô tả cách xử lý các khoản tiền bất thường: tiền về muộn, thu hai lần, kết quả mâu thuẫn. Ở mọi đường hoàn hoặc áp một khoản như vậy (xử lý cảnh báo, hoặc gọi hoàn trực tiếp), Hub hỏi lại cổng để có kết luận trước, vì khoản đó chỉ dựa vào một thông báo chưa kiểm; việc hoàn đi theo đường tự động hoặc thủ công tùy cổng."
  read:
    - "Đọc từ trên xuống: cảnh báo, hỏi lại cổng, kết luận, rồi tới cách hoàn."
    - "Ba nhánh ở \"Kết luận\" quyết định có được hoàn hay chưa; hai nhánh cuối là cách hoàn."
  details:
    - term: "Cảnh báo late_success"
      text: "Ba loại cảnh báo này được sinh ở sơ đồ 3 và 4. Mỗi cái là bằng chứng về một khoản tiền, chưa chắc có thật cho tới khi cổng xác nhận."
    - term: "Hub hỏi lại cổng bằng query"
      text: "Khi hoàn hoặc áp một khoản nằm trong cảnh báo, Hub hỏi cổng xem tiền có thật không và ghi kết luận lên cảnh báo; đã có kết luận thành công thì không hỏi lại."
    - term: "Cho phép hoàn tiền"
      text: "Cổng xác nhận có tiền: được hoàn. Áp khoản tiền cho đơn chỉ dùng được với tiền về muộn, khi đơn còn OPEN và đúng số tiền."
    - term: "not_confirmed"
      text: "Cổng chưa xác nhận có tiền (nói không có, đang xử lý, hoặc không trả lời): Hub từ chối hoàn hoặc áp, không tạo bản ghi hoàn và không gọi cổng. Chỉ người vận hành (quản trị) ép được bằng force, sau khi tự đối chiếu ngoài hệ thống."
    - term: "Hỏi lại theo lịch"
      text: "Khi cổng đang xử lý hoặc không trả lời, Hub tiếp tục hỏi ở nền; khi cổng đã nói không có thì không hỏi nữa."
    - term: "REQUESTED, PROCESSING"
      text: "Cổng có API hoàn: lời gọi hoàn có thể trả kết quả ngay; nếu chưa có kết quả thì yêu cầu ở lại các trạng thái này và đối soát hỏi tiếp."
    - term: "MANUAL_REQUIRED"
      text: "Cổng không có API hoàn, hoặc cổng trả lời phải hoàn tay: người vận hành hoàn rồi xác nhận."
  pitfalls:
    - "Cảnh báo không tự hoàn tiền; phải có yêu cầu hoàn."
    - "Hoàn một lần thử đã SUCCEEDED bình thường không bị hỏi lại cổng; chỉ khoản nằm trong cảnh báo (tiền về muộn, thu hai lần) mới phải được cổng xác nhận trước."
    - "Các cảnh báo khác (tiền bị cổng đảo lại funds_reversed, tranh chấp dispute_*, khoản giữ mồ côi late_authorization) chỉ xử lý bằng ignore kèm ghi chú và không đi qua sơ đồ này."
    - "API hoàn tiền của các cổng thật chưa được kiểm; mới chạy với mô phỏng."
  basis: "9f4e55dd6eeb7ff9"
direction: "TB"
