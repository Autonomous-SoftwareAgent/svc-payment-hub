id: "luong-3-ap-su-kien"
type: "flowchart"
title: "3. Áp một sự kiện lên attempt"
tab: "business"
sources:
  - "src/hub.js"
explain:
  meaning: "Đây là nơi Hub quyết định một sự kiện về tiền có được đổi trạng thái của lần thử và của đơn hay không. Nguyên tắc: kết quả cuối không bao giờ bị ghi đè; sự kiện trùng thì bỏ, sự kiện đến muộn hoặc mâu thuẫn thì thành cảnh báo để phân xử, không âm thầm đổi tiền."
  read:
    - "Đọc từ trên xuống như một chuỗi câu hỏi; câu nào trả lời \"Có\" thì rẽ sang ô kết quả và dừng."
    - "Nửa trên là các chốt chặn (trùng, nguồn không đáng tin, chuyển khoản, lệch tiền); nửa dưới là phần đổi trạng thái thật."
    - "Các ô bắt đầu bằng \"Cảnh báo\" không đổi trạng thái. Ba loại late_success, duplicate_charge, conflicting_result được Hub hỏi lại cổng để phân xử (sơ đồ 7); amount_mismatch thì chờ người vận hành."
  details:
    - term: "Đã thấy khóa"
      text: "Khóa chống trùng gồm cổng, mã, giao dịch, loại và nguồn. Sự kiện đã thấy thì không đổi gì."
    - term: "Nguồn là return"
      text: "Tin đi qua trình duyệt của khách khi quay về cửa hàng không đáng tin, nên chỉ được ghi nhật ký."
    - term: "Loại received"
      text: "Khoản nhận kiểu chuyển khoản đi theo đường cộng dồn riêng, xem sơ đồ 4."
    - term: "amount_mismatch"
      text: "Cổng báo thành công nhưng số tiền khác số tiền của đơn: giữ lại và cảnh báo, không ghi nhận trả tiền."
    - term: "Attempt đã có kết quả cuối"
      text: "SUCCEEDED, FAILED, CANCELLED, EXPIRED là kết quả cuối. Sự kiện đến sau hoặc là trùng, hoặc sinh cảnh báo, hoặc chỉ được ghi nhật ký; không cái nào đổi được trạng thái."
    - term: "late_success"
      text: "Cổng báo có tiền sau khi lần thử đã thất bại, hủy hoặc hết hạn: trạng thái giữ nguyên; nếu cổng xác nhận thì khoản tiền cần được hoàn hoặc áp cho đơn."
    - term: "duplicate_charge"
      text: "Đơn đã được trả mà lại có thêm một khoản thu: do một lần thử khác cũng thành công, hoặc cùng lần thử có thêm một giao dịch thành công khác. Khách có thể đã bị thu hai lần."
    - term: "conflicting_result"
      text: "Báo thất bại sau khi đã ghi thành công: trạng thái thành công được giữ, cảnh báo để phân xử."
    - term: "attempt SUCCEEDED rồi xét đơn"
      text: "Lần thử thành công; đơn đang OPEN thì thành PAID, đơn đã PAID hoặc đã CLOSED thì sinh cảnh báo tương ứng."
  pitfalls:
    - "Sơ đồ có 22 ô nên phải phóng to mới đọc hết; dùng nút \"Vừa khung\" để thấy toàn cảnh trước."
    - "\"Trạng thái không đổi\" không có nghĩa là bỏ qua: mỗi cảnh báo là bằng chứng về một khoản tiền, cần được cổng xác nhận rồi xử lý."
    - "Sơ đồ không vẽ các sự kiện tiền bị cổng đảo lại (reversed), tranh chấp (dispute) và giữ tiền (authorized); chúng được xử lý riêng."
    - "Việc cổng thật có gửi kết quả muộn hay mâu thuẫn theo các kiểu này hay không chưa được kiểm với cổng thật."
  basis: "73c11c1e8c1b699e"
