explain:
  meaning: "Hình cho biết Hub nói chuyện với dịch vụ khác (cửa hàng, Kafka) bằng những module nào và ai phụ thuộc ai. Lõi không import connector nào và nhận sink qua deps.sinks; thêm một kênh gửi mới chỉ là thêm một tệp connector. Nhờ vậy lỗi ở một kênh gửi không làm hỏng việc thu tiền."
  read:
    - "Mũi tên \"dependency\" và \"composition\" là require trong mã. Mũi tên \"implementation\" KHÔNG phải require: chỉ nói module khớp hình dạng cổng, kiểm lúc chạy bằng assertSink hoặc assertInbound."
    - "Ports (xanh lá) là các kiểu chuẩn mà mọi bên cùng hướng vào: lõi, app và connector không import nhau mà gặp nhau ở đây."
    - "Connector vào và Sink ra không có mũi tên nào tới PaymentHub: chúng không import lõi (test connectors-arch giữ điều này)."
    - "MainWiring là nơi duy nhất nối Hub với app, máy chủ và connector."
  details:
    - term: "MainWiring"
      text: "main.js: dựng Hub, tạo app, dựng các sink ra từ registry và khởi động các connector vào (kiểm hình dạng bằng assertInbound)."
    - term: "HttpServer"
      text: "server.js: máy chủ HTTP; lo xác thực Bearer, giới hạn tải, /health, /metrics và callback của cổng thanh toán, rồi chuyển thao tác cho app qua connector http."
    - term: "App"
      text: "Lớp ứng dụng: tự kiểm quyền (role) và schema đầu vào của từng thao tác rồi gọi Hub qua HubPort; connector http chỉ dịch. Không import hub.js nên không phụ thuộc cách Hub cài đặt."
    - term: "Operations"
      text: "Danh mục thao tác (tạo thanh toán, hoàn tiền, xử lý cảnh báo...). Connector vào sinh route từ danh mục này thay vì viết tay từng route."
    - term: "Ports"
      text: "Khai báo kiểu thật của Sink, InboundConnector và HubPort cùng các hàm kiểm hình dạng; Sink cần validate và deliver, HubPort liệt kê các hàm Hub phải có."
    - term: "ConnectorRegistry"
      text: "Quét thư mục connectors/in và connectors/out, mỗi tệp xuất {kind, create}; trùng kind là lỗi. Thêm connector là thêm tệp."
    - term: "OutboundSinks"
      text: "Đích gửi sự kiện ra: webhook (có ký) và Kafka. Hộp thư đi gọi deliver; sink không đoán nghiệp vụ."
    - term: "EventOutbox"
      text: "Hộp thư đi của lõi: ghi bản giao vào kho cùng transaction với đổi trạng thái, giao qua sink theo lịch thử lại; thử hết số lần thì dead. Import app/ports (events.js:22) để kiểm sink."
    - term: "PaymentHub"
      text: "Lõi Hub: giữ hộp thư đi (events) và gọi emit; không import connector nào."
    - term: "HttpConnector"
      text: "Dịch đường dẫn và thân JSON thành thao tác rồi gọi app.execute. KHÔNG chạy nền và không có start hay stop: server.js gọi trực tiếp. main.js từ chối nguồn vào có source http."
    - term: "KafkaIn"
      text: "Nguồn vào chạy nền, nhận lệnh từ Kafka; có start và stop. Ngoài app còn nhận config, deps và log, và require connectors/_kafka.js."
  pitfalls:
    - "Không có mũi tên từ App tới PaymentHub vì app không import hub.js; lúc chạy MainWiring đưa hub vào createApp. Mũi tên chỉ là import hoặc khớp hình dạng, không phải đường gọi lúc chạy."
    - "ConnectorRegistry nạp connector bằng require động theo đường dẫn tìm được lúc chạy, nên mũi tên tới connector không phải một dòng require cố định."
    - "Hình bỏ vài module phụ: schemas, views, errors, openapi, commands.js (nhận lệnh Kafka, app/app.js require) và connectors/_kafka.js dùng chung hai connector Kafka."
    - "server.js cũng require app/operations (dòng 18), tự dựng một app riêng (createApp({getHub}), dòng 71) khác app của main.js cho connector vào, và gọi Hub trực tiếp cho callback cổng và metrics, không qua App."
    - "Lõi còn dấu vết tên webhook: tuyến mặc định tên webhook (LEGACY, cấu hình webhooks.url), deliverWebhooks, listWebhooks, docs.kind webhook. Là di sản thiết kế đầu; Kafka chỉ có trong chú thích lõi."
    - "Chỉ thấy test Kafka dùng kafkaFactory giả (test/hub/kafka-connectors.test.js). Gửi tới cửa hàng thật hoặc broker Kafka thật chưa kiểm."
  basis: "12da1b1440da08b8"
