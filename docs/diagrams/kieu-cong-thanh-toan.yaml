id: "kieu-cong-thanh-toan"
type: "class"
title: "Module và hợp đồng phía cổng thanh toán"
tab: "architecture"
sources:
  - "src/hub.js"
  - "src/contract.js"
  - "src/routing.js"
  - "src/guard.js"
  - "src/events.js"
  - "src/store.js"
  - "src/store-postgres.js"
  - "src/adapters/registry.js"
  - "src/adapters/fail-codes.js"
  - "src/adapters/stripe/index.js"
  - "src/main.js"
  - "test/hub/adapters-arch.test.js"
explain:
  meaning: "Hình cho biết mã phía cổng thanh toán được chia thế nào để thêm một cổng mới (như Stripe, PayPal) không làm đụng tới phần xử lý tiền của Hub. Lõi Hub chỉ nói chuyện với cổng qua hợp đồng chuẩn; mỗi cổng là một adapter tự dịch tiếng của cổng sang hợp đồng. Nhờ vậy sửa một cổng không thể làm sai cách Hub tính tiền, đơn và hoàn tiền của cổng khác."
  read:
    - "Mũi tên đi từ module phụ thuộc (require) sang module được dùng. Nhãn trên mũi tên nói dùng để làm gì."
    - "Màu xanh lá là hợp đồng chuẩn, xanh dương là lõi Hub và các module của lõi, hồng là phía adapter cổng, vàng là điểm nối main.js."
    - "Quy tắc cốt lõi: lõi và adapter cùng hướng vào Contract, nhưng lõi KHÔNG có mũi tên nào tới adapter. Mũi tên GatewayAdapters tới Contract là cam kết kiểu, không phải import (xem Dễ hiểu nhầm)."
    - "Chỉ MainWiring biết cả hai phía: nó nhờ AdapterRegistry tìm các adapter rồi đưa cho Hub."
  details:
    - term: "PaymentHub"
      text: "Lõi: tạo đơn, tạo lần thử, nhận thông báo của cổng, đối soát nền, hoàn tiền, xử lý cảnh báo tiền. Nhận adapter từ ngoài đưa vào, không biết tên cổng nào."
    - term: "Contract"
      text: "Hợp đồng chuẩn: loại sự kiện, mã lý do thất bại, phương án thanh toán, đơn vị tiền, và các hàm kiểm hình dạng adapter và sự kiện. Không import gì trong dự án (test adapters-arch giữ điều này)."
    - term: "Routing"
      text: "Chọn cổng nào được thử cho một đơn theo phương án thanh toán, loại tiền và cổng đang khả dụng. Chỉ import Contract; Hub đưa adapter và hàm kiểm tra khả dụng vào. Chính nhờ lọc theo loại tiền mà đơn VND không bao giờ tới PayPal (PayPal không khai VND)."
    - term: "GatewayGuard"
      text: "Bọc từng adapter bằng giới hạn thời gian, giới hạn đồng thời, ngắt mạch (circuit breaker) và ghi nhật ký mỗi lần gọi cổng."
    - term: "EventOutbox"
      text: "Hộp thư đi: ghi sự kiện gửi cửa hàng cùng lúc với thay đổi trạng thái. Nó còn import app/ports (kiểm sink), không vẽ ở đây: xem sơ đồ kieu-ket-noi-dich-vu."
    - term: "MemoryStore"
      text: "Kho giữ đơn, lần thử, hoàn tiền, cảnh báo trong bộ nhớ, có chỉ mục và theo dõi thay đổi. Là kho mặc định khi Hub không được đưa kho khác."
    - term: "PostgresStore"
      text: "Kho bền vững: kế thừa MemoryStore và ghi các thay đổi xuống PostgreSQL trong một transaction; nạp lại phần còn hoạt động khi khởi động."
    - term: "AdapterRegistry"
      text: "Quét thư mục adapters/ và nạp mọi thư mục có index.js xuất adapter = {id, create}; thêm cổng không phải sửa tệp nào có sẵn (PayPal được thêm đúng cách này). Không import gì trong dự án."
    - term: "FailCodes"
      text: "Phần dùng chung của các adapter: dựng bảng ánh xạ mã lỗi riêng của cổng sang mã thất bại chuẩn; mã lạ phải thành unknown."
    - term: "GatewayAdapters"
      text: "Các adapter trong src/adapters tại thời điểm viết: vnpay, momo, onepay, sepay, stripe, paypal; registry nạp bất cứ thư mục nào có ở đó. Mỗi adapter chỉ import thư mục của nó, fail-codes và contract."
    - term: "MainWiring"
      text: "main.js dựng mọi thứ khi khởi động; cùng index.js là nơi duy nhất ngoài adapters import adapter. Không tên cổng nào viết cứng trong lõi: test adapters-arch lấy danh sách tên từ chính các thư mục trong src/adapters nên tự gồm cả stripe và paypal."
  pitfalls:
    - "Mũi tên là quan hệ require trong mã, KHÔNG phải luồng chạy: lúc chạy Hub vẫn gọi adapter, và thông báo của cổng đi qua adapter về Hub, nhưng chúng đi qua đối tượng được đưa vào chứ không qua import."
    - "AdapterRegistry nạp adapter bằng require động theo đường dẫn tìm được lúc chạy, nên mũi tên tới GatewayAdapters không phải một dòng require cố định trong mã."
    - "Hình gộp các adapter thành một khối và chỉ nêu hàm chính; chi tiết từng cổng nằm trong thư mục adapter. Danh sách cổng là những gì src/adapters có lúc viết."
    - "Các adapter mới (stripe, paypal) được kiểm bằng simulator và test, chưa kiểm với cổng thật. Hình chỉ nói cách mã được tổ chức, không bảo đảm hành vi với cổng thật."
    - "Điểm nối index.js và các module phụ (metrics.js, check-config.js, server.js) không vẽ để hình gọn; phía kết nối dịch vụ nằm ở sơ đồ kieu-ket-noi-dich-vu."
    - "Mũi tên GatewayAdapters tới Contract (implementation) KHÔNG phải import: stripe và paypal require ../../contract; vnpay, momo, onepay, sepay chỉ require ../fail-codes. Hub kiểm adapter đúng hợp đồng LÚC CHẠY bằng assertAdapterShape."
  basis: "f780cd9d2e654594"
direction: "TB"
