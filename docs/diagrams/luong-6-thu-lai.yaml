id: "luong-6-thu-lai"
type: "flowchart"
title: "6. Thử lại hoặc chuyển sang cổng khác"
tab: "business"
sources:
  - "src/hub.js"
explain:
  meaning: "Khi một lần thử không thành, cửa hàng có thể xin thử lại hoặc chuyển cổng. Sơ đồ cho thấy các điều kiện Hub buộc phải thỏa trước khi tạo lần thử mới, để không có hai lần thử cùng lúc có thể thu tiền của một đơn."
  read:
    - "Đọc từ trên xuống; mỗi câu trả lời xấu dẫn tới một ô lỗi 409 và dừng."
    - "Chỉ khi qua cả ba câu hỏi mới tới ô tạo lần thử mới."
  details:
    - term: "Đơn còn OPEN"
      text: "Đơn đã trả hoặc đã đóng thì không tạo thêm lần thử."
    - term: "Chuyển cổng bị tắt"
      text: "Cấu hình có thể tắt chuyển cổng (chỉ áp cho yêu cầu chuyển cổng) hoặc giới hạn số lần thử của một đơn (áp cho mọi yêu cầu, đếm cả lần thử bị cổng từ chối lúc tạo)."
    - term: "Còn attempt nào có thể nhận tiền"
      text: "Lần thử ở CREATED, AWAITING hoặc UNKNOWN vẫn có thể thu được tiền. Lần thử đang được cổng giữ tiền (AUTHORIZED) cũng chặn, và Hub không tự hủy nó."
    - term: "Gọi hủy"
      text: "Hub chỉ gọi hủy khi cửa hàng yêu cầu hủy và cổng hủy được; hủy thành công thì lần thử cũ mới được coi là hết khả năng nhận tiền. Hub không tự hủy."
    - term: "attempt_still_live"
      text: "Còn lần thử có thể nhận tiền mà không hủy được, hoặc cửa hàng không yêu cầu hủy: Hub từ chối tạo lần thử mới để tránh thu hai lần."
    - term: "Tạo attempt mới"
      text: "Khi chuyển cổng, Hub ưu tiên cổng chưa thử cho đơn này."
  pitfalls:
    - "Sau khi một lần thử đã được tạo ở cổng, Hub không tự tạo lần thử khác khi nó thất bại về sau; phải có yêu cầu của cửa hàng. Riêng trong lúc tạo, cổng từ chối rõ ràng hoặc Hub chưa gọi được thì Hub tự thử cổng kế tiếp (sơ đồ 1)."
    - "Việc từng cổng thật có hủy được hay không lấy từ khai báo của adapter, chưa kiểm với cổng thật."
  basis: "31d18512e0843cd7"
