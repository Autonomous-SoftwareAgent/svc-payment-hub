id: "luong-4-chuyen-khoan"
type: "flowchart"
title: "4. Khoản chuyển khoản (kiểu SePay)"
tab: "business"
sources:
  - "src/hub.js"
explain:
  meaning: "Với kiểu chuyển khoản, khách có thể chuyển thiếu, thừa hoặc chuyển nhiều lần. Sơ đồ mô tả cách Hub cộng dồn các khoản nhận của một lần thử và quyết định đơn đã đủ tiền hay chưa."
  read:
    - "Đọc từ trên xuống: một khoản nhận đi qua chốt chống trùng, được cộng vào tổng, rồi so tổng với số tiền của đơn."
    - "Ba ô cuối là ba kết cục theo tổng đã nhận: đủ, thừa, thiếu."
  details:
    - term: "Mã giao dịch đã có"
      text: "Cùng một khoản có thể tới hai lần, qua webhook và qua sao kê; mã giao dịch giúp chỉ tính một lần. Việc hai kênh của SePay thật dùng cùng một mã là giả định, chưa kiểm."
    - term: "Cộng vào tổng đã nhận"
      text: "Mỗi lần thử giữ tổng các khoản đã nhận, không chỉ khoản mới nhất."
    - term: "Attempt còn nhận tiền"
      text: "Lần thử đã có kết quả cuối mà tiền vẫn về thì sinh cảnh báo: duplicate_charge nếu lần thử đã thành công hoặc đơn đã được trả bằng lần thử khác, late_success trong các trường hợp còn lại."
    - term: "SUCCEEDED, đơn PAID"
      text: "Tổng đã đủ: lần thử thành công; đơn đang OPEN thì được ghi nhận đã trả."
    - term: "overpaid"
      text: "Chuyển thừa: lần thử vẫn thành công và đơn được ghi nhận đã trả; phần dư được ghi lại để hoàn."
    - term: "underpaid"
      text: "Chuyển thiếu: lần thử tiếp tục chờ, và tự hoàn tất khi khách bù đủ."
  pitfalls:
    - "Chuyển thiếu không làm đơn thất bại. Lần thử vẫn đang chờ nên đơn cũng không tự đóng khi quá hạn; Hub chỉ gắn cờ cho người vận hành khi lần thử tồn tại quá lâu."
    - "Cách SePay thật báo các khoản này mới theo tài liệu và mô phỏng, chưa kiểm với SePay thật."
  basis: "ccfa10438acd87d9"
