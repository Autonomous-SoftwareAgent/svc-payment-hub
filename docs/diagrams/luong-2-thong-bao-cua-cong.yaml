id: "luong-2-thong-bao-cua-cong"
type: "flowchart"
title: "2. Thông báo của cổng đi vào Hub"
tab: "business"
sources:
  - "src/hub.js"
explain:
  meaning: "Sơ đồ mô tả đường đi của một thông báo do cổng thanh toán gọi về Hub. Thông báo không được tin sẵn: adapter phải kiểm xác thực trước, và tiền không gắn được vào lần thử nào vẫn được giữ lại kèm cảnh báo chứ không bị bỏ."
  read:
    - "Đọc từ trên xuống: cổng gọi vào, adapter kiểm và đọc, Hub tìm lần thử, áp sự kiện, lưu, rồi trả lời cổng."
    - "Hai ô cảnh báo ở giữa là chỗ tiền về mà Hub không biết thuộc đơn nào."
    - "Mọi nhánh có đổi dữ liệu đều đi qua ô \"Lưu mọi thay đổi trong một transaction\" trước khi cổng nhận được câu trả lời."
  details:
    - term: "Adapter kiểm xác thực"
      text: "Mỗi cổng có cách xác thực riêng; adapter của cổng đó kiểm và đổi thông báo thành sự kiện chuẩn."
    - term: "Không đổi gì"
      text: "Sai chữ ký hoặc thông báo hỏng: không đổi gì về tiền hay đơn, chỉ ghi một dòng nhật ký, và trả lời lỗi theo đúng kiểu cổng đó quy định."
    - term: "Bỏ qua, trả ack thành công"
      text: "Thông báo hợp lệ nhưng không phải tin về tiền vào (ví dụ tiền ra): trả lời thành công để cổng không gửi lại."
    - term: "unmatched_funds"
      text: "Tiền về không kèm mã nào khớp, thường do khách ghi sai nội dung chuyển khoản. Tiền được giữ để người vận hành xử lý."
    - term: "unknown_attempt"
      text: "Thông báo có mã nhưng Hub không có lần thử nào mang mã đó. Cũng được giữ kèm cảnh báo."
    - term: "Áp sự kiện lên attempt"
      text: "Phần quyết định trạng thái nằm ở sơ đồ 3."
    - term: "Adapter dựng ack"
      text: "Câu trả lời dựng theo kết quả xử lý thật và chỉ được gửi cho cổng sau khi đã lưu xong; lưu hỏng thì cổng nhận lỗi."
  pitfalls:
    - "Trả lời thành công cho cổng không có nghĩa là đơn đã được ghi nhận trả tiền; nó chỉ nói Hub đã nhận và xử lý thông báo."
    - "Mức kiểm xác thực tùy cấu hình của từng cổng; với SePay, chế độ mặc định của adapter là không kiểm và công cụ kiểm cấu hình sẽ cảnh báo."
    - "Cách từng cổng thật ký và gửi lại thông báo mới theo tài liệu và mô phỏng, chưa kiểm với cổng thật."
  basis: "b454d1860b1020dd"
