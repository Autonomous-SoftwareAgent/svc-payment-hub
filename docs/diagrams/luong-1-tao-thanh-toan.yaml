id: "luong-1-tao-thanh-toan"
type: "flowchart"
title: "1. Tạo thanh toán"
tab: "business"
sources:
  - "src/hub.js"
  - "src/routing.js"
explain:
  meaning: "Sơ đồ mô tả điều xảy ra khi cửa hàng gọi tạo thanh toán: Hub kiểm dữ liệu, tránh tạo trùng đơn, chọn cổng, rồi nhờ adapter tạo thanh toán ở cổng. Điểm quan trọng với tiền: gọi lại cùng orderId khi đơn cũ còn mở hoặc đã trả thì không tạo thêm đơn, và khi mất phản hồi của cổng thì Hub không tự thử cổng khác."
  read:
    - "Đọc từ trên xuống; mỗi ô hình thoi là một điểm quyết định, nhãn trên mũi tên là câu trả lời."
    - "Các ô mang mã 400, 409, 503 là chỗ Hub trả lỗi cho cửa hàng và dừng."
    - "Mũi tên quay lại từ \"attempt FAILED\" về \"Còn cổng nào?\" là vòng thử cổng kế tiếp, diễn ra ngay trong cùng lời gọi."
  details:
    - term: "Đã có payment cùng orderId"
      text: "Chống trùng theo cửa hàng và orderId, chỉ khi đơn cũ chưa CLOSED: cùng số tiền và loại tiền thì trả lại đơn cũ, khác thì báo xung đột. Đơn đã CLOSED không chặn việc tạo đơn mới."
    - term: "Tạo payment OPEN"
      text: "Đơn mới ở trạng thái OPEN, có hạn thanh toán: mặc định 30 phút, cấu hình được, và cửa hàng có thể gửi hạn riêng."
    - term: "Lọc cổng"
      text: "Chỉ giữ cổng đang bật, đúng sản phẩm, trong khoảng số tiền, nhận loại tiền của đơn và (nếu đơn yêu cầu) đúng phương án thanh toán; rồi xếp theo ưu tiên."
    - term: "Tạo attempt"
      text: "Mỗi lần thử ở một cổng là một attempt có mã tham chiếu riêng, để tiền về sau gắn đúng lần thử."
    - term: "attempt AWAITING"
      text: "Đã có URL hoặc hướng dẫn chuyển khoản; Hub trả cho cửa hàng và chờ khách trả tiền."
    - term: "attempt UNKNOWN"
      text: "Lời gọi tạo mất phản hồi nên không biết cổng đã tạo hay chưa. Chỉ xảy ra với cổng phải gọi qua mạng lúc tạo. Hub không thử cổng khác, vì khách có thể vẫn trả được ở cổng này."
    - term: "attempt FAILED"
      text: "Cổng từ chối rõ ràng, hoặc Hub chưa gửi được lời gọi đi: chắc chắn không thu được tiền ở lần thử này, nên được phép thử cổng kế tiếp."
  pitfalls:
    - "\"Mất phản hồi\" không phải là thất bại: coi nó là thất bại rồi chuyển cổng có thể làm khách bị thu tiền hai lần."
    - "Việc chọn cổng theo danh sách ưu tiên cấu hình sẵn, không theo số liệu đo tỉ lệ thành công."
    - "Mọi nhánh mới chỉ chạy với cổng mô phỏng, chưa kiểm với cổng thật."
  basis: "a01bccbf4f419067"
direction: "TB"
