id: "trang-thai-attempt"
type: "state"
title: "Một lần thử thanh toán (attempt)"
tab: "architecture"
sources:
  - "src/hub.js"
explain:
  meaning: "Mỗi lần khách thử trả tiền là một attempt, và trạng thái của nó quyết định Hub có được coi tiền đã về hay chưa. Sơ đồ cho thấy khi nào một attempt còn có thể nhận tiền (CREATED, AWAITING, UNKNOWN, AUTHORIZED) và khi nào đã đóng hẳn (SUCCEEDED, FAILED, CANCELLED, EXPIRED). Trạng thái đóng không bao giờ quay lại: tiền về muộn trên attempt đã đóng được ghi thành cảnh báo cho người vận hành, không đổi trạng thái."
  read:
    - "Đọc từ CREATED (chấm đầu) đi theo mũi tên; nhãn trên mũi tên là điều làm trạng thái đổi."
    - "Bốn trạng thái cuối là SUCCEEDED, FAILED, CANCELLED, EXPIRED: không có mũi tên đi ra."
    - "AWAITING là khách chưa trả xong; UNKNOWN là Hub không chắc cổng đã tạo giao dịch hay chưa."
    - "AUTHORIZED là cổng đã giữ tiền nhưng chưa thu; chỉ có đường ra là thu, nhả hoặc cổng báo đã giải phóng."
  details:
    - term: "CREATED"
      text: "Attempt vừa tạo trong Hub, chưa biết kết quả gọi cổng."
    - term: "AWAITING"
      text: "Cổng đã trả đường dẫn hoặc hướng dẫn chuyển khoản; chờ khách trả và chờ cổng báo."
    - term: "UNKNOWN"
      text: "Gọi cổng mất phản hồi. Hub không coi là thất bại vì cổng có thể đã tạo giao dịch; đối soát nền hỏi lại."
    - term: "AUTHORIZED"
      text: "Cổng đang giữ tiền của khách nhưng chưa thu. Đơn vẫn mở, không có attempt khác được tạo trong lúc giữ. Hub không tự thu hay tự nhả: người gọi capture hoặc void, hoặc người vận hành xử lý nếu giữ quá lâu."
    - term: "SUCCEEDED"
      text: "Tiền đã thu đủ. Đây là trạng thái duy nhất làm đơn thành PAID."
    - term: "FAILED"
      text: "Cổng từ chối hoặc báo thất bại chắc chắn; với attempt đang giữ tiền thì nghĩa là cổng đã giải phóng khoản giữ."
    - term: "CANCELLED"
      text: "Hub hủy attempt (chuyển cổng) hoặc nhả khoản giữ bằng void."
    - term: "EXPIRED"
      text: "Cổng báo hết hạn thanh toán hoặc hết hạn giữ tiền."
  pitfalls:
    - "Sơ đồ không vẽ thao tác capture hoặc void mất phản hồi: khi đó attempt vẫn là AUTHORIZED, Hub ghi nhớ thao tác đang chờ xác nhận và hỏi lại cổng, không đổi trạng thái theo đoán."
    - "AUTHORIZED chưa phải tiền đã thu: đơn vẫn OPEN cho tới khi attempt thành SUCCEEDED."
    - "Đường vào AUTHORIZED mới kiểm với adapter giả; chưa có cổng thật nào báo giữ tiền, nên chưa biết cổng thật hết hạn giữ hay nhả ra sao."
    - "Mũi tên không có nhãn (AWAITING sang trạng thái cuối) là kết quả cổng báo qua IPN hoặc truy vấn; nhãn chi tiết nằm ở luồng áp sự kiện."
  basis: "50b8766e6265095f"
