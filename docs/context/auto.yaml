schema: 1
diagrams:
  - id: "tu-sinh-cac-lop"
    review:
      verdict: "đúng"
      note: "Khớp mã: Chuẩn hóa 24 tệp (9 src/app, contract.js, 14 trong src/adapters), Logic 7, Vào/ra 5, Ngoài 16. Logic→Chuẩn hóa 3 lệnh nhập: hub và routing nhập contract.js, events.js:22 nhập app/ports.js."
      basis: "382b7f9195be69c3"
      at: "2026-10-06"
    explain:
      meaning: "Sơ đồ gộp mã của Payment Hub thành bốn nhóm và cho biết nhóm nào nhập nhóm nào. Đây là bản rút gọn của sơ đồ phụ thuộc theo thư mục: thay vì từng tệp, đọc nhanh xem ba lớp (vào/ra, chuẩn hóa, logic nội bộ) có giữ hướng một chiều không. Với tiền, ý nghĩa là việc đổi hay thêm một cổng thanh toán chỉ chạm nhóm Chuẩn hóa (thư mục adapters), không chạm Logic nội bộ."
      read:
        - "Bốn khung là bốn nhóm; mỗi khung ghi số tệp và vài tên tệp đầu, phần còn lại ghi là và N tệp nữa."
        - "Mũi tên giữa hai khung là các lệnh nhập đã gộp; mũi tên đôi ghi số lệnh nhập (ví dụ 9)."
        - "Đọc hướng: Vào/ra và Ngoài các lớp trỏ vào Chuẩn hóa và Logic; Logic nội bộ chỉ trỏ sang Chuẩn hóa (hợp đồng)."
        - "Không có cạnh từ Logic nội bộ sang Vào/ra: đó là điều ranh giới ba lớp đòi hỏi."
      details:
        - term: "Logic nội bộ"
          text: "7 tệp: hub.js, routing.js, events.js, store.js, store-postgres.js, guard.js, metrics.js. Chỉ biết dạng chuẩn, không biết cổng nào đứng sau."
        - term: "Vào/ra"
          text: "5 tệp: connectors/in/http.js, in/kafka.js, out/kafka.js, out/webhook.js và server.js. Lo giao thức, không chứa nghiệp vụ."
        - term: "Chuẩn hóa"
          text: "24 tệp: contract.js, chín tệp src/app (app, commands, errors, openapi, operations, ports, schema, schemas, views) và 14 tệp trong src/adapters (registry, fail-codes và năm thư mục cổng VNPay, MoMo, OnePAY, SePay, Stripe). Mỗi cổng gọi cổng thật và dịch dạng của cổng sang dạng chuẩn trong cùng một tệp."
        - term: "Ngoài các lớp đã khai"
          text: "16 tệp: điểm nối và cấu hình (main.js, index.js, check-config.js, connectors/registry.js, connectors/_kafka.js), infra/local và tools (bench, openapi, simulator của từng cổng)."
      pitfalls:
        - "Adapter cổng nằm hoàn toàn ở Chuẩn hóa dù thực tế mỗi adapter vừa gọi cổng (vào/ra) vừa dịch (chuẩn hóa) trong cùng tệp; đó là nợ đã biết P-008, không phải hình sai."
        - "Ba lệnh nhập từ Logic nội bộ sang Chuẩn hóa là hub.js và routing.js nhập contract.js, events.js nhập app/ports.js. Đó là hợp đồng chuẩn, không phải phụ thuộc vào một cổng cụ thể."
        - "Hình chỉ thấy lệnh nhập viết thẳng trong mã. Registry nạp adapter và connector theo tên thư mục lúc chạy, nên không có mũi tên tương ứng (đã khai riêng bằng quan hệ agent khai)."
        - "Số liệu theo lần commit gần nhất; mã chưa commit không có mặt."
      basis: "382b7f9195be69c3"
  - id: "tu-sinh-cua-vao-ra"
    review:
      verdict: "đúng"
      note: "21 đường dẫn khớp mã: 14 trong operations.js, cộng /ipn và /return (GET, POST; server.js:32, 136, 160), /health (157), /metrics (167), /openapi.json (177). 5 bảng khớp store-postgres.js:95-110; tên topic khớp infra/local/hub.config.json."
      basis: "a9fc2c69916e0da4"
      at: "2026-10-06"
    explain:
      meaning: "Sơ đồ liệt kê những cửa mà Payment Hub nhận việc từ bên ngoài (21 đường dẫn API), dữ liệu và sự kiện nó ghi ra, và các hệ thống nó phụ thuộc. Với tiền, cửa quan trọng nhất là /ipn/{gateway} và /return/{gateway}: cổng thanh toán báo kết quả về Hub qua đó. Các cửa còn lại là của cửa hàng và người vận hành."
      read:
        - "Đọc từ trái sang phải: khung Cửa vào (đường dẫn API) đi vào Payment Hub ở giữa; từ Payment Hub đi ra Dữ liệu và sự kiện và Phụ thuộc vào."
        - "Mỗi nút ở khung Cửa vào gom đường dẫn theo phần đầu (ví dụ /payments có 5 đường dẫn) kèm danh sách phương thức và đường dẫn."
        - "Hình trụ là bảng cơ sở dữ liệu; hình viên thuốc là topic Kafka; khung Phụ thuộc vào lấy từ khai báo trong service.yaml chứ không đọc từ mã."
      details:
        - term: "/payments"
          text: "Tạo thanh toán, xem một đơn, tạo attempt mới (thử lại hoặc chuyển cổng), thu tiền đang giữ (capture) và nhả tiền đang giữ (void). Cửa hàng và quản trị đều gọi được; cửa hàng chỉ thấy đơn của mình."
        - term: "/refunds"
          text: "POST /refunds tạo hoàn tiền (cửa hàng hoặc quản trị); POST /refunds/{refundId}/done xác nhận hoàn tiền thủ công đã làm xong (chỉ quản trị)."
        - term: "/anomalies"
          text: "Danh sách tiền bất thường và phân xử (hoàn tiền, áp vào đơn, bỏ qua). Chỉ quản trị."
        - term: "/reconcile"
          text: "Chạy đối soát ngay, không chờ vòng nền. Chỉ quản trị."
        - term: "/gateways"
          text: "Tình trạng từng cổng: ngắt mạch (breaker) và số lời gọi đang chạy. Chỉ quản trị."
        - term: "/calls"
          text: "Nhật ký lời gọi tới cổng thanh toán. Chỉ quản trị."
        - term: "/webhooks"
          text: "Danh sách bản giao sự kiện ra ngoài (mọi tuyến, không riêng webhook) và gửi lại thủ công một bản đã dead hoặc đang chờ. Cửa hàng chỉ thấy bản của mình."
        - term: "/ipn"
          text: "GET và POST /ipn/{gateway}: cổng báo kết quả từ máy cổng về Hub (xác thực bằng chữ ký của cổng, không bằng token cửa hàng). Hub kiểm chữ ký, chuẩn hóa rồi áp lên lần thử."
        - term: "/return"
          text: "GET và POST /return/{gateway}: trình duyệt khách quay về sau khi trả tiền. Chỉ để hiển thị, không đổi trạng thái đơn."
        - term: "/health"
          text: "Hub còn sống hay không (trả ok: true)."
        - term: "/metrics"
          text: "Số đo dạng Prometheus."
        - term: "/openapi.json"
          text: "Mô tả API theo OpenAPI, sinh từ danh mục thao tác."
        - term: "5 bảng"
          text: "calls, docs, events, meta, seen. Gần như mọi đối tượng nghiệp vụ nằm trong bảng docs dưới dạng JSON."
        - term: "payment.events.v1"
          text: "Topic Hub phát sự kiện thanh toán. Tên là cấu hình theo môi trường (ví dụ infra/local/hub.config.json), không cố định trong mã."
        - term: "payment.commands.v1"
          text: "Topic Hub nhận lệnh từ dịch vụ khác; lệnh không xử lý được chuyển sang payment.commands.v1.dlq (cấu hình dlqTopic)."
        - term: "Payment Hub"
          text: "Dịch vụ ở giữa. Mũi tên vào gom 21 đường dẫn."
      pitfalls:
        - "Hình nói có những cửa nào, không nói ai gọi được: quyền từng đường dẫn xem src/app/operations.js (ghi chú ở từng mục chỉ là tóm tắt)."
        - "Đường dẫn /ipn và /return có phần cổng đổi theo tên cổng ({gateway}); hình gom chúng thành một đường dẫn mẫu."
        - "Tên topic là cấu hình theo môi trường chứ không phải hằng số trong mã; môi trường khác có thể dùng tên khác."
        - "Khung Phụ thuộc vào là khai báo tay trong service.yaml, không chứng minh bằng mã; đừng đọc đó là danh sách đã quét."
        - "Mọi cổng thanh toán ở đây mới chạy với bộ mô phỏng, chưa kiểm với cổng thật."
      basis: "a9fc2c69916e0da4"
  - id: "tu-sinh-phu-thuoc-module"
    review:
      verdict: "đúng"
      note: "Mọi lệnh nhập khớp require trong src. Năm adapter cổng nay nằm ở Chuẩn hóa (service.yaml khai src/adapters). Chưa thấy nạp lúc chạy: adapters/registry.js:15, connectors/registry.js:17 (đã khai bằng context_relate)."
      basis: "1824f0b87274ecf8"
      at: "2026-10-06"
    explain:
      meaning: "Sơ đồ cho biết tệp nào của Payment Hub gọi (nhập) tệp nào, gộp theo thư mục, máy đọc thẳng từ mã. Với tiền thì nó trả lời một câu: phần quyết định tiền (hub.js và các tệp cùng lớp) có biết cổng thanh toán cụ thể nào không. Câu trả lời là không: hub.js chỉ nhập contract.js, events.js, guard.js, metrics.js, routing.js và store.js, không tệp nào trong số đó nhập một adapter cổng."
      read:
        - "Đọc theo khung màu: Logic nội bộ (nghiệp vụ, trạng thái, kho), Vào/ra (HTTP, Kafka, webhook), Chuẩn hóa (hợp đồng chuẩn, lớp ứng dụng và các adapter cổng), rồi nhóm Ngoài các lớp đã khai."
        - "Mũi tên đơn là một lệnh nhập giữa hai tệp hoặc thư mục. Mũi tên đôi giữa hai khung là gộp nhiều lệnh nhập, con số ghi trên mũi tên."
        - "Chiều mũi tên là chiều phụ thuộc: tệp ở đầu mũi tên nhập tệp ở cuối. Mũi tên từ Logic nội bộ chỉ được tới Chuẩn hóa (hợp đồng), không được tới Vào/ra."
        - "Số trong nhãn nút là số dòng mã, chỉ để thấy cỡ: hub.js hơn 1200 dòng là tệp lớn nhất."
      details:
        - term: "hub.js"
          text: "Lõi: máy trạng thái thanh toán, attempt, hoàn tiền, đối soát. Chỉ nhập sáu tệp cùng lớp hoặc hợp đồng chuẩn."
        - term: "store-postgres.js"
          text: "Kho PostgreSQL; chỉ nhập store.js (bản bộ nhớ) để dùng chung logic kho."
        - term: "events.js"
          text: "Hàng đợi phát sự kiện ra ngoài. Nhập app/ports.js để kiểm các đầu nhận (sink) đúng hình; là một trong ba lệnh nhập từ Logic sang Chuẩn hóa."
        - term: "contract.js"
          text: "Hợp đồng chuẩn giữa lõi và adapter: loại sự kiện, mã lý do thất bại, bảng số lẻ tiền tệ. Nơi duy nhất lõi và các cổng gặp nhau."
        - term: "app/"
          text: "Lớp ứng dụng: danh mục thao tác, schema, mã lỗi, cổng (port). Server HTTP và connector Kafka đều đi qua đây, nên hai đường vào cho cùng một kết quả."
        - term: "connectors/in/"
          text: "Cửa vào HTTP và Kafka. Chỉ nhập connectors/_kafka.js (ở nhóm Ngoài các lớp) và không nhập hub."
        - term: "adapters/momo/"
          text: "Một trong năm adapter cổng (cùng onepay, sepay, stripe, vnpay). Mỗi thư mục chỉ nhập adapters/fail-codes.js hoặc contract.js, không nhập adapter khác."
        - term: "adapters/"
          text: "Hai tệp gốc của thư mục: registry.js (nạp adapter lúc chạy) và fail-codes.js (bảng mã lỗi dùng chung)."
        - term: "main.js"
          text: "Điểm nối: nạp cấu hình, dựng hub, kho, server và connector. Là nơi duy nhất ghép các lớp lại."
        - term: "tools/sim/"
          text: "Bộ mô phỏng cổng, chạy riêng; không thuộc lớp nào và không nhập mã của lõi."
      pitfalls:
        - "Hình chỉ thấy lệnh nhập viết thẳng trong mã. Việc registry nạp adapter và connector theo tên thư mục lúc chạy (adapters/registry.js, connectors/registry.js) không có mũi tên; nó được khai riêng bằng quan hệ agent khai."
        - "Mỗi adapter cổng nằm ở Chuẩn hóa dù trong cùng tệp nó vừa gọi cổng thật (vào/ra) vừa dịch dạng (chuẩn hóa); đó là nợ đã biết P-008."
        - "Chữ adapters/ xuất hiện hai nơi cho hai thứ khác nhau: nút adapters/ (hai tệp gốc) và các nút adapters/<cổng>/ (từng cổng)."
        - "Không có mũi tên nghĩa là không nhập nhau, không nói gì về lúc chạy: lõi gọi adapter qua đối tượng được tiêm lúc dựng (main.js), không qua lệnh nhập."
        - "Ranh giới này chỉ được giữ chắc nhờ test quét import (test/hub/adapters-arch.test.js, connectors-arch.test.js); hình chỉ phản ánh trạng thái tại lần commit."
      basis: "1824f0b87274ecf8"
